name: om_ornament
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^3.11.0
  firebase_auth: ^5.4.2
  cloud_firestore: ^5.6.3
  provider: ^6.1.2
  firebase_storage: ^12.4.2
  firebase_database: ^11.3.3
  http: ^1.3.0
  shared_preferences: ^2.5.2
  geocoding: ^3.0.0
  url_launcher: ^6.3.1
  permission_handler: ^11.4.0
  cached_network_image: ^3.4.1
  cloudinary_flutter: ^1.3.0
  cloudinary_url_gen: ^1.7.0
  flutter_dotenv: ^5.2.1
  intl: ^0.20.2
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  firebase_messaging: ^15.2.4
  flutter_launcher_icons: ^0.14.3
  get: ^4.7.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/image/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/image/logo2.png"
  adaptive_icon_foreground: "assets/image/logo2.png"  # Same logo for adaptive icons
  adaptive_icon_background: "#272626"  # White background


